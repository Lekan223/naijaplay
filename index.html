<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NaijaPlay">
<meta name="theme-color" content="#0b0f0c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>NaijaPlay</title>
<style>
:root{--bg:#0b0f0c;--card:#151b17;--card2:#1d2520;--text:#f2f5f3;--muted:#8d9a92;--accent:#1fd664;--danger:#ff5d5d;--safe-b:env(safe-area-inset-bottom);--safe-t:env(safe-area-inset-top)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Segoe UI,Roboto,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
#app{display:flex;flex-direction:column;height:100%}
header{padding:calc(var(--safe-t) + 14px) 16px 8px}
h1{margin:0 0 10px;font-size:26px;letter-spacing:-.5px}
h1 span{color:var(--accent)}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;background:var(--card);border:1px solid #26302a;border-radius:12px;padding:12px 14px;color:var(--text);font-size:16px;outline:none}
.search input:focus{border-color:var(--accent)}
.search button{background:var(--accent);color:#04120a;font-weight:700;border-radius:12px;padding:0 16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--card);border:1px solid #26302a;border-radius:999px;padding:7px 14px;font-size:14px;color:var(--muted)}
.chip.on{background:var(--accent);color:#04120a;border-color:var(--accent);font-weight:600}
.tabs{display:flex;border-bottom:1px solid #1d2520;margin:0 16px}
.tab{flex:1;padding:12px 0;color:var(--muted);font-weight:600;border-bottom:2px solid transparent}
.tab.on{color:var(--text);border-color:var(--accent)}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 8px calc(96px + var(--safe-b))}
.row{display:flex;align-items:center;gap:12px;padding:8px;border-radius:12px;width:100%;text-align:left}
.row:active{background:var(--card)}
.row.now .t{color:var(--accent)}
.art{width:50px;height:50px;border-radius:8px;background:var(--card2) center/cover no-repeat;flex:none}
.meta{flex:1;min-width:0}
.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.heart{font-size:22px;padding:6px 8px;color:var(--muted)}
.heart.on{color:var(--danger)}
.msg{color:var(--muted);text-align:center;padding:40px 20px;line-height:1.5}
.sec{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;color:var(--muted);font-size:13px}
.sec button{color:var(--accent);font-weight:600}
/* mini player */
#mini{position:fixed;left:8px;right:8px;bottom:calc(8px + var(--safe-b));background:var(--card2);border-radius:16px;box-shadow:0 8px 30px #000a;display:none;overflow:hidden}
#mini.show{display:block}
#mini .in{display:flex;align-items:center;gap:12px;padding:8px 10px}
#mini .pp{font-size:26px;width:44px;height:44px}
#mini .bar{height:3px;background:#2a352e}
#mini .bar i{display:block;height:100%;width:0;background:var(--accent)}
/* full player */
#full{position:fixed;inset:0;background:linear-gradient(#16231b,#0b0f0c 70%);transform:translateY(100%);transition:transform .3s ease;display:flex;flex-direction:column;padding:calc(var(--safe-t) + 12px) 24px calc(var(--safe-b) + 24px);z-index:5}
#full.open{transform:none}
#full .top{display:flex;justify-content:space-between;align-items:center}
#full .top button{font-size:24px;padding:8px}
#cover{width:100%;max-width:340px;aspect-ratio:1;margin:18px auto;border-radius:16px;background:var(--card2) center/cover no-repeat;box-shadow:0 20px 50px #000a}
#full h2{margin:0;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#full .by{color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#seek{width:100%;margin:22px 0 4px;accent-color:var(--accent)}
.times{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}
.ctrl{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.ctrl button{font-size:28px;padding:10px;color:var(--text)}
.ctrl .big{background:var(--accent);color:#04120a;width:72px;height:72px;border-radius:50%;font-size:30px;padding:0}
.ctrl .tog.on{color:var(--accent)}
.spin{display:inline-block;width:22px;height:22px;border:3px solid #26302a;border-top-color:var(--accent);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Naija<span>Play</span></h1>
    <form class="search" id="sform">
      <input id="q" type="search" placeholder="Search songs, artists, covers..." enterkeyhint="search" autocomplete="off">
      <button type="submit">Go</button>
    </form>
    <div class="chips" id="chips"></div>
  </header>
  <div class="tabs">
    <button class="tab on" data-tab="discover">Discover</button>
    <button class="tab" data-tab="favs">Favorites</button>
    <button class="tab" data-tab="queue">Queue</button>
  </div>
  <main id="list"></main>
</div>

<div id="mini">
  <div class="in" id="miniOpen">
    <div class="art" id="miniArt"></div>
    <div class="meta"><div class="t" id="miniT"></div><div class="s" id="miniS"></div></div>
    <button class="pp" id="miniPP" aria-label="Play or pause">▶</button>
  </div>
  <div class="bar"><i id="miniBar"></i></div>
</div>

<div id="full">
  <div class="top"><button id="close" aria-label="Close">⌄</button><div style="color:var(--muted);font-size:13px">Now playing</div><button id="fheart" aria-label="Favorite">♡</button></div>
  <div id="cover"></div>
  <h2 id="fT"></h2>
  <div class="by" id="fS"></div>
  <input type="range" id="seek" min="0" max="1000" value="0">
  <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
  <div class="ctrl">
    <button class="tog" id="shuf" aria-label="Shuffle">⤮</button>
    <button id="prev" aria-label="Previous">⏮</button>
    <button class="big" id="pp" aria-label="Play or pause">▶</button>
    <button id="next" aria-label="Next">⏭</button>
    <button class="tog" id="rep" aria-label="Repeat">⟲</button>
  </div>
</div>

<audio id="audio" preload="auto" playsinline></audio>

<script>
const API = 'https://api.audius.co/v1';
const APP = 'naijaplay';
const $ = id => document.getElementById(id);
const audio = $('audio');

const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};

const state = {
  tab: 'discover',
  results: [],          // tracks shown in Discover
  status: 'loading',    // loading | ok | empty | error
  favs: store.get('np_favs', []),
  queue: [],            // current playing list
  idx: -1,
  shuffle: store.get('np_shuffle', false),
  repeat: store.get('np_repeat', 0), // 0 off, 1 all, 2 one
  chip: 'Afrobeats'
};

const CHIPS = [
  {l:'Afrobeats', type:'genre', v:'Afrobeats'},
  {l:'Naija', type:'search', v:'naija'},
  {l:'Amapiano', type:'search', v:'amapiano'},
  {l:'Covers', type:'search', v:'afrobeats cover'},
  {l:'Yoruba', type:'search', v:'yoruba'},
  {l:'Highlife', type:'search', v:'highlife'},
  {l:'Street Pop', type:'search', v:'street pop'},
  {l:'Hip-Hop', type:'genre', v:'Hip-Hop/Rap'},
  {l:'R&B', type:'genre', v:'R&B/Soul'},
  {l:'Dancehall', type:'genre', v:'Dancehall'},
  {l:'Gospel', type:'search', v:'gospel'}
];

function fmt(s){ s = Math.max(0, Math.floor(s || 0)); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }
function artOf(t){ const a = t.artwork || {}; return a['480x480'] || a['150x150'] || a['1000x1000'] || ''; }
function streamUrl(t){ return `${API}/tracks/${t.id}/stream?app_name=${APP}`; }
function isFav(t){ return state.favs.some(f => f.id === t.id); }
function toggleFav(t){
  if (isFav(t)) state.favs = state.favs.filter(f => f.id !== t.id);
  else state.favs.unshift(slim(t));
  store.set('np_favs', state.favs);
  render(); syncFull();
}
function slim(t){ return { id:t.id, title:t.title, duration:t.duration, artwork:t.artwork, user:{ name:(t.user||{}).name } }; }
function cur(){ return state.queue[state.idx]; }

async function api(path){
  const r = await fetch(`${API}${path}${path.includes('?') ? '&' : '?'}app_name=${APP}`);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const j = await r.json();
  return (j.data || []).filter(t => t && t.is_streamable !== false && !t.is_stream_gated && !t.is_unlisted);
}

async function load(chip, query){
  state.status = 'loading'; state.results = []; render();
  try {
    let data;
    if (query) data = await api(`/tracks/search?query=${encodeURIComponent(query)}&limit=50`);
    else if (chip.type === 'genre') data = await api(`/tracks/trending?genre=${encodeURIComponent(chip.v)}&time=week&limit=50`);
    else data = await api(`/tracks/search?query=${encodeURIComponent(chip.v)}&limit=50`);
    state.results = data.map(slim);
    state.status = data.length ? 'ok' : 'empty';
  } catch (e) { state.status = 'error'; }
  render();
}

function renderChips(){
  const box = $('chips'); box.innerHTML = '';
  CHIPS.forEach(c => {
    const b = document.createElement('button');
    b.className = 'chip' + (state.chip === c.l ? ' on' : '');
    b.textContent = c.l;
    b.onclick = () => { state.chip = c.l; $('q').value = ''; setTab('discover'); renderChips(); load(c); };
    box.appendChild(b);
  });
}

function row(t, list, i){
  const b = document.createElement('div');
  b.className = 'row' + (cur() && cur().id === t.id ? ' now' : '');
  b.setAttribute('role', 'button');
  const art = document.createElement('div'); art.className = 'art';
  const a = artOf(t); if (a) art.style.backgroundImage = `url("${a}")`;
  const meta = document.createElement('div'); meta.className = 'meta';
  const ti = document.createElement('div'); ti.className = 't'; ti.textContent = t.title;
  const su = document.createElement('div'); su.className = 's'; su.textContent = ((t.user||{}).name || 'Unknown') + (t.duration ? ' · ' + fmt(t.duration) : '');
  meta.append(ti, su);
  const h = document.createElement('button');
  h.className = 'heart' + (isFav(t) ? ' on' : ''); h.textContent = isFav(t) ? '♥' : '♡'; h.setAttribute('aria-label','Favorite');
  h.onclick = e => { e.stopPropagation(); toggleFav(t); };
  b.append(art, meta, h);
  b.onclick = () => playList(list, i);
  return b;
}

function render(){
  const box = $('list'); box.innerHTML = '';
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === state.tab));
  let list = [];
  if (state.tab === 'discover') {
    if (state.status === 'loading') { box.innerHTML = '<div class="msg"><span class="spin"></span></div>'; return; }
    if (state.status === 'error') { box.innerHTML = '<div class="msg">Could not reach Audius. Check your internet and tap a category to retry.</div>'; return; }
    if (state.status === 'empty') { box.innerHTML = '<div class="msg">No songs found. Try another search.</div>'; return; }
    list = state.results;
  } else if (state.tab === 'favs') {
    list = state.favs;
    if (!list.length) { box.innerHTML = '<div class="msg">No favorites yet.<br>Tap the ♡ on any song to save it here.</div>'; return; }
  } else {
    list = state.queue;
    if (!list.length) { box.innerHTML = '<div class="msg">Nothing in the queue.<br>Play a song and the list shows up here.</div>'; return; }
  }
  if (state.tab === 'favs' || state.tab === 'discover') {
    const sec = document.createElement('div'); sec.className = 'sec';
    sec.innerHTML = '<span></span><button>▶ Play all</button>';
    sec.firstChild.textContent = list.length + ' songs';
    sec.querySelector('button').onclick = () => playList(list, 0);
    box.appendChild(sec);
  }
  const frag = document.createDocumentFragment();
  list.forEach((t, i) => frag.appendChild(row(t, list, i)));
  box.appendChild(frag);
}

function setTab(t){ state.tab = t; render(); }

/* playback */
function playList(list, i){
  state.queue = list.slice(); state.idx = i; startCurrent();
}
function startCurrent(){
  const t = cur(); if (!t) return;
  audio.src = streamUrl(t);
  audio.play().catch(() => {});
  updateUI(); updateMedia();
}
function next(auto){
  if (!state.queue.length) return;
  if (auto && state.repeat === 2) { audio.currentTime = 0; audio.play().catch(()=>{}); return; }
  if (state.shuffle && state.queue.length > 1) {
    let n; do { n = Math.floor(Math.random() * state.queue.length); } while (n === state.idx);
    state.idx = n;
  } else if (state.idx < state.queue.length - 1) state.idx++;
  else if (state.repeat === 1 || !auto) state.idx = 0;
  else { audio.pause(); return; }
  startCurrent();
}
function prev(){
  if (!state.queue.length) return;
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  state.idx = state.idx > 0 ? state.idx - 1 : state.queue.length - 1;
  startCurrent();
}
function toggle(){ if (!cur()) return; audio.paused ? audio.play().catch(()=>{}) : audio.pause(); }

function updateUI(){
  const t = cur(); if (!t) return;
  $('mini').classList.add('show');
  const a = artOf(t);
  const bg = a ? `url("${a}")` : '';
  $('miniArt').style.backgroundImage = bg; $('cover').style.backgroundImage = bg;
  const name = (t.user||{}).name || 'Unknown';
  $('miniT').textContent = t.title; $('miniS').textContent = name;
  $('fT').textContent = t.title; $('fS').textContent = name;
  syncFull(); render();
}
function syncFull(){
  const t = cur(); if (!t) return;
  $('fheart').textContent = isFav(t) ? '♥' : '♡';
  $('fheart').style.color = isFav(t) ? 'var(--danger)' : '';
  $('shuf').classList.toggle('on', state.shuffle);
  $('rep').classList.toggle('on', state.repeat > 0);
  $('rep').textContent = state.repeat === 2 ? '⟲¹' : '⟲';
}
function updatePP(){
  const s = audio.paused ? '▶' : '⏸';
  $('miniPP').textContent = s; $('pp').textContent = s;
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = audio.paused ? 'paused' : 'playing';
}
function updateMedia(){
  if (!('mediaSession' in navigator)) return;
  const t = cur(); if (!t) return;
  const a = artOf(t);
  navigator.mediaSession.metadata = new MediaMetadata({
    title: t.title, artist: (t.user||{}).name || 'Unknown', album: 'NaijaPlay',
    artwork: a ? [{ src: a, sizes: '480x480', type: 'image/jpeg' }] : []
  });
}
if ('mediaSession' in navigator) {
  const ms = navigator.mediaSession;
  const set = (n, f) => { try { ms.setActionHandler(n, f); } catch(e){} };
  set('play', () => audio.play().catch(()=>{}));
  set('pause', () => audio.pause());
  set('previoustrack', prev);
  set('nexttrack', () => next(false));
  set('seekto', d => { if (d.seekTime != null) audio.currentTime = d.seekTime; });
  set('seekbackward', d => { audio.currentTime = Math.max(0, audio.currentTime - (d.seekOffset || 10)); });
  set('seekforward', d => { audio.currentTime = audio.currentTime + (d.seekOffset || 10); });
}

let seeking = false;
audio.addEventListener('play', updatePP);
audio.addEventListener('pause', updatePP);
audio.addEventListener('ended', () => next(true));
audio.addEventListener('error', () => { if (cur()) setTimeout(() => next(true), 800); });
audio.addEventListener('timeupdate', () => {
  const d = audio.duration || (cur() && cur().duration) || 0;
  const p = d ? audio.currentTime / d : 0;
  $('miniBar').style.width = (p * 100) + '%';
  if (!seeking) $('seek').value = Math.round(p * 1000);
  $('cur').textContent = fmt(audio.currentTime);
  $('dur').textContent = fmt(d);
  if ('mediaSession' in navigator && d && isFinite(d)) {
    try { navigator.mediaSession.setPositionState({ duration: d, position: Math.min(audio.currentTime, d), playbackRate: 1 }); } catch(e){}
  }
});
$('seek').addEventListener('input', () => { seeking = true; });
$('seek').addEventListener('change', () => {
  const d = audio.duration || (cur() && cur().duration) || 0;
  audio.currentTime = ($('seek').value / 1000) * d; seeking = false;
});

/* wiring */
$('miniPP').onclick = e => { e.stopPropagation(); toggle(); };
$('pp').onclick = toggle;
$('next').onclick = () => next(false);
$('prev').onclick = prev;
$('shuf').onclick = () => { state.shuffle = !state.shuffle; store.set('np_shuffle', state.shuffle); syncFull(); };
$('rep').onclick = () => { state.repeat = (state.repeat + 1) % 3; store.set('np_repeat', state.repeat); syncFull(); };
$('fheart').onclick = () => { const t = cur(); if (t) toggleFav(t); };
$('miniOpen').onclick = () => $('full').classList.add('open');
$('close').onclick = () => $('full').classList.remove('open');
document.querySelectorAll('.tab').forEach(b => b.onclick = () => setTab(b.dataset.tab));
$('sform').addEventListener('submit', e => {
  e.preventDefault();
  const q = $('q').value.trim(); if (!q) return;
  $('q').blur(); state.chip = ''; renderChips(); setTab('discover'); load(null, q);
});

renderChips();
load(CHIPS[0]);
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
