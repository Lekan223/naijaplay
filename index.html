<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NaijaPlay">
<meta name="theme-color" content="#0e0b1f">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>NaijaPlay</title>
<style>
:root{
  --ink:#0e0b1f;
  --accent:#ffc23d;
  --on-accent:#1a1100;
  --love:#ff5c8a;
  --text:#fff;
  --text-2:rgba(255,255,255,.66);
  --text-3:rgba(255,255,255,.42);
  --sb:env(safe-area-inset-bottom,0px);
  --st:env(safe-area-inset-top,0px);
  --tab-b:calc(var(--sb) * .45 + 10px);
  --tab-h:64px;
  --mini-b:calc(var(--tab-b) + var(--tab-h) + 10px);
  --ease:cubic-bezier(.32,.72,0,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--ink);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
svg{display:block;fill:currentColor}

/* ---------- glass material ---------- */
.glass{
  background:linear-gradient(145deg,rgba(255,255,255,.17),rgba(255,255,255,.06));
  -webkit-backdrop-filter:blur(26px) saturate(185%);
  backdrop-filter:blur(26px) saturate(185%);
  border:1px solid rgba(255,255,255,.16);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.30),inset 0 -1px 0 rgba(255,255,255,.04),0 12px 32px rgba(4,2,16,.38);
}

/* ---------- ambient background ---------- */
#bg{position:fixed;inset:0;overflow:hidden;z-index:0;background:var(--ink)}
#bg::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(14,11,31,.30),rgba(14,11,31,.72))}
.blob{position:absolute;width:85vmax;height:85vmax;border-radius:50%;opacity:.55;will-change:transform}
.b1{left:-35vmax;top:-30vmax;background:radial-gradient(circle,#ff4f9a,transparent 62%);animation:d1 38s ease-in-out infinite alternate}
.b2{right:-40vmax;top:15vh;background:radial-gradient(circle,#ffb23e,transparent 62%);animation:d2 46s ease-in-out infinite alternate}
.b3{left:-20vmax;bottom:-45vmax;background:radial-gradient(circle,#2fd4c0,transparent 62%);animation:d3 52s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(22vmax,18vmax)}}
@keyframes d2{to{transform:translate(-26vmax,12vmax)}}
@keyframes d3{to{transform:translate(24vmax,-14vmax)}}
.bgl{position:absolute;inset:-20%;background-size:cover;background-position:center;
  filter:blur(46px) saturate(1.7) brightness(.9);opacity:0;transition:opacity .9s ease}
.bgl.on{opacity:.95}

/* ---------- scroll area ---------- */
#scroll{position:fixed;inset:0;z-index:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-top:calc(var(--st) + 10px);
  padding-bottom:calc(var(--mini-b) + 64px + 28px)}
#statusglass{position:fixed;left:0;right:0;top:0;height:var(--st);z-index:5;
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  background:linear-gradient(rgba(14,11,31,.55),rgba(14,11,31,.1));
  -webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
#hero{padding:6px 18px 12px}
h1{margin:4px 0 14px;font-size:36px;line-height:1.05;font-weight:800;letter-spacing:-.035em}
#sform{display:flex;align-items:center;gap:10px;border-radius:16px;padding:0 14px;height:48px}
#sform svg{width:20px;height:20px;color:var(--text-2);flex:none}
#q{flex:1;min-width:0;height:100%;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:16px;-webkit-appearance:none;-webkit-user-select:text;user-select:text}
#q::placeholder{color:var(--text-3)}

#chipsbar{position:sticky;top:var(--st);z-index:3;padding:8px 0 10px}
#chipsbar::before{content:"";position:absolute;left:0;right:0;top:0;bottom:-16px;z-index:-1;
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  background:linear-gradient(rgba(14,11,31,.62),rgba(14,11,31,0));
  -webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent);
  opacity:0;transition:opacity .2s ease}
#chipsbar.stuck::before{opacity:1}
#chips{display:flex;gap:8px;overflow-x:auto;padding:0 18px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 16px;border-radius:999px;font-size:14.5px;font-weight:600;color:var(--text-2);
  transition:transform .12s ease,background-color .2s ease,color .2s ease}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 6px 18px rgba(255,194,61,.28)}

/* ---------- list ---------- */
#listhead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px 6px}
#listhead h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#listhead h2 small{font-size:14px;font-weight:500;letter-spacing:0;color:var(--text-3);margin-left:8px}
#playall{flex:none;display:flex;align-items:center;gap:6px;height:36px;padding:0 14px 0 11px;border-radius:999px;font-weight:600;font-size:14.5px}
#playall svg{width:16px;height:16px}
#playall:active,.ib:active{transform:scale(.94)}
#list{padding:0 8px}
.row{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:18px;cursor:pointer;outline:none}
.row:active{background:rgba(255,255,255,.10)}
.row.now{background:rgba(255,255,255,.09)}
.art{position:relative;flex:none;width:56px;height:56px;border-radius:14px;background:rgba(255,255,255,.08) center/cover no-repeat;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.meta{flex:1;min-width:0}
.t{font-size:16px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.now .t{color:var(--accent)}
.s{margin-top:3px;font-size:13.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dur{flex:none;font-size:13px;color:var(--text-3);font-variant-numeric:tabular-nums}
.heart{flex:none;width:40px;height:40px;display:grid;place-items:center;color:var(--text-3);transition:transform .15s ease,color .15s ease}
.heart svg{width:22px;height:22px}
.heart.on{color:var(--love)}
.heart:active{transform:scale(.8)}
.eq{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;gap:3px;padding-bottom:17px;background:rgba(14,11,31,.55)}
.eq i{width:4px;height:20px;border-radius:2px;background:var(--accent);transform-origin:bottom;transform:scaleY(.35);animation:eq 1s ease-in-out infinite;animation-play-state:paused}
.eq i:nth-child(2){animation-delay:-.4s;animation-duration:.8s}
.eq i:nth-child(3){animation-delay:-.7s;animation-duration:1.1s}
body.playing .eq i{animation-play-state:running}
@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}

.skel{display:flex;align-items:center;gap:12px;padding:8px 10px}
.skel .art{box-shadow:none}
.skel .ln{height:12px;border-radius:6px;background:rgba(255,255,255,.09);margin-bottom:9px}
.skel .art,.skel .ln{background-image:linear-gradient(100deg,rgba(255,255,255,.07) 30%,rgba(255,255,255,.16) 50%,rgba(255,255,255,.07) 70%);background-size:220% 100%;animation:sh 1.4s linear infinite}
@keyframes sh{from{background-position:120% 0}to{background-position:-120% 0}}

.msg{margin:36px 18px;padding:26px 22px;border-radius:24px;text-align:center}
.msg b{display:block;font-size:18px;letter-spacing:-.02em;margin-bottom:6px}
.msg p{margin:0;color:var(--text-2);line-height:1.5;font-size:15px}
.msg button{margin-top:16px;height:42px;padding:0 22px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:700;border:0}

/* ---------- tab bar ---------- */
#tabbar{position:fixed;left:16px;right:16px;bottom:var(--tab-b);height:var(--tab-h);z-index:9;border-radius:32px;display:flex;padding:6px;gap:4px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:26px;color:var(--text-2);font-size:11px;font-weight:600;transition:background-color .2s ease,color .2s ease}
.tab svg{width:24px;height:24px}
.tab.on{background:rgba(255,255,255,.14);color:var(--accent)}
.tab:active{transform:scale(.96)}

/* ---------- mini player ---------- */
#mini{position:fixed;left:12px;right:12px;bottom:var(--mini-b);z-index:8;border-radius:24px;overflow:hidden;display:none;cursor:pointer}
#mini.show{display:block}
#mini .in{display:flex;align-items:center;gap:12px;padding:8px 8px 11px 8px}
#mini .art{width:46px;height:46px;border-radius:12px}
#mini .t{font-size:15px}
#mini .s{font-size:13px;margin-top:2px}
.mb{flex:none;width:44px;height:44px;display:grid;place-items:center}
.mb svg{width:24px;height:24px}
.mb:active{transform:scale(.88)}
#miniTrack{position:absolute;left:14px;right:14px;bottom:5px;height:3px;border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden}
#miniBar{display:block;height:100%;width:0;background:var(--accent);border-radius:2px}

/* ---------- full player ---------- */
#full{position:fixed;inset:0;z-index:20;overflow:hidden;visibility:hidden;transform:translateY(100%);
  transition:transform .45s var(--ease),visibility 0s linear .45s;background:var(--ink)}
#full.open{visibility:visible;transform:none;transition:transform .45s var(--ease),visibility 0s}
#fbg{position:absolute;inset:-25%;background-size:cover;background-position:center;filter:blur(54px) saturate(1.8) brightness(.85)}
#fscrim{position:absolute;inset:0;background:linear-gradient(rgba(14,11,31,.25),rgba(14,11,31,.78))}
.fin{position:relative;height:100%;display:flex;flex-direction:column;padding:calc(var(--st) + 8px) 24px calc(var(--sb) + 22px)}
#fdrag{flex:1;min-height:0;display:flex;flex-direction:column;touch-action:none}
.grab{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.4);margin:0 auto 10px}
.ftop{display:flex;align-items:center;justify-content:space-between}
.ftop span{font-size:14px;font-weight:600;color:var(--text-2)}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.ib svg{width:22px;height:22px}
#fheart.on{color:var(--love)}
.coverwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px 0}
#cover{height:100%;max-height:calc(100vw - 48px);aspect-ratio:1/1;border-radius:28px;background:rgba(255,255,255,.08) center/cover no-repeat;
  box-shadow:0 30px 60px rgba(4,2,16,.55),0 0 0 1px rgba(255,255,255,.10);transition:transform .55s var(--ease)}
body:not(.playing) #cover{transform:scale(.88)}
.info{padding:6px 2px 0}
#fT{margin:0;font-size:24px;font-weight:700;letter-spacing:-.025em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fS{margin-top:4px;font-size:17px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#seek{--p:0%;-webkit-appearance:none;appearance:none;display:block;width:100%;height:30px;margin:14px 0 0;background:transparent;outline:none}
#seek::-webkit-slider-runnable-track{height:6px;border-radius:99px;background:linear-gradient(90deg,var(--accent) var(--p),rgba(255,255,255,.22) var(--p))}
#seek::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;margin-top:-6px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.45)}
#seek::-moz-range-track{height:6px;border-radius:99px;background:rgba(255,255,255,.22)}
#seek::-moz-range-progress{height:6px;border-radius:99px;background:var(--accent)}
#seek::-moz-range-thumb{width:18px;height:18px;border:0;border-radius:50%;background:#fff}
.times{display:flex;justify-content:space-between;margin-top:-2px;font-size:12.5px;color:var(--text-2);font-variant-numeric:tabular-nums}
.panel{margin-top:16px;border-radius:38px;display:flex;align-items:center;justify-content:space-between;padding:14px 18px}
.panel button{width:52px;height:52px;display:grid;place-items:center;border-radius:50%;color:var(--text);transition:transform .12s ease,color .2s ease}
.panel button:active{transform:scale(.88)}
.panel button svg{width:26px;height:26px}
.panel .tog{color:var(--text-3)}
.panel .tog.on{color:var(--accent)}
.panel .big{width:72px;height:72px;background:var(--accent);color:var(--on-accent);box-shadow:0 10px 26px rgba(255,194,61,.38)}
.panel .big svg{width:32px;height:32px}

/* ---------- accessibility ---------- */
.row:focus-visible,button:focus-visible,#sform:focus-within{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){
  .blob,.eq i,.skel .art,.skel .ln{animation:none}
  #full,#full.open{transition:opacity .2s ease,visibility 0s}
  #full{transform:none;opacity:0}#full.open{opacity:1}
  #cover{transition:none}body:not(.playing) #cover{transform:none}
  .bgl{transition:none}
}
@media (prefers-reduced-transparency:reduce){
  .glass{background:#2a2447;-webkit-backdrop-filter:none;backdrop-filter:none}
  #chipsbar::before,#statusglass{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(14,11,31,.92)}
}
@media (prefers-contrast:more){.glass{background:#2a2447;border-color:rgba(255,255,255,.5)}}
@media (max-height:700px){#fT{font-size:21px}.panel{margin-top:8px;padding:8px 14px}.panel .big{width:64px;height:64px}}
</style>
</head>
<body>
<div id="bg" aria-hidden="true">
  <i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i>
  <i class="bgl" id="bgA"></i><i class="bgl" id="bgB"></i>
</div>
<div id="statusglass" aria-hidden="true"></div>

<div id="scroll">
  <section id="hero">
    <h1>NaijaPlay</h1>
    <form id="sform" class="glass" role="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5 20 20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Search songs, artists, covers" enterkeyhint="search" autocomplete="off" autocapitalize="off" aria-label="Search">
    </form>
  </section>
  <div id="chipsbar"><div id="chips"></div></div>
  <div id="listhead"><h2 id="lhT"></h2><button id="playall" class="glass" hidden></button></div>
  <div id="list"></div>
</div>

<div id="mini" class="glass">
  <div class="in" id="miniOpen">
    <div class="art" id="miniArt"></div>
    <div class="meta"><div class="t" id="miniT"></div><div class="s" id="miniS"></div></div>
    <button class="mb" id="miniPP" aria-label="Play or pause"></button>
    <button class="mb" id="miniNext" aria-label="Next song"></button>
  </div>
  <div id="miniTrack"><i id="miniBar"></i></div>
</div>

<nav id="tabbar" class="glass" aria-label="Sections">
  <button class="tab on" data-tab="discover" id="tabDiscover"></button>
  <button class="tab" data-tab="favs" id="tabFavs"></button>
  <button class="tab" data-tab="queue" id="tabQueue"></button>
</nav>

<section id="full" aria-label="Now playing">
  <div id="fbg"></div><div id="fscrim"></div>
  <div class="fin">
    <div id="fdrag">
      <div class="grab"></div>
      <div class="ftop">
        <button class="ib glass" id="close" aria-label="Close player"></button>
        <span>Now playing</span>
        <button class="ib glass" id="fheart" aria-label="Favorite"></button>
      </div>
      <div class="coverwrap"><div id="cover"></div></div>
    </div>
    <div class="info"><h2 id="fT"></h2><div id="fS"></div></div>
    <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek">
    <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    <div class="panel glass">
      <button class="tog" id="shuf" aria-label="Shuffle"></button>
      <button id="prev" aria-label="Previous song"></button>
      <button class="big" id="pp" aria-label="Play or pause"></button>
      <button id="next" aria-label="Next song"></button>
      <button class="tog" id="rep" aria-label="Repeat"></button>
    </div>
  </div>
</section>

<audio id="audio" preload="auto" playsinline></audio>

<script>
const API = 'https://api.audius.co/v1';
const APP = 'naijaplay';
const $ = id => document.getElementById(id);
const audio = $('audio');

/* ---------- icons ---------- */
const S = 'fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"';
const I = {
  play:'<svg viewBox="0 0 24 24"><path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11-6.86a1 1 0 0 0 0-1.72l-11-6.86A1 1 0 0 0 8 5.14z"/></svg>',
  pause:'<svg viewBox="0 0 24 24"><rect x="6" y="4.5" width="4.2" height="15" rx="1.4"/><rect x="13.8" y="4.5" width="4.2" height="15" rx="1.4"/></svg>',
  next:'<svg viewBox="0 0 24 24"><path d="M5 5.7v12.6a.9.9 0 0 0 1.4.75l8.5-6.3a.9.9 0 0 0 0-1.5L6.4 4.95A.9.9 0 0 0 5 5.7z"/><rect x="16.4" y="4.6" width="2.8" height="14.8" rx="1.3"/></svg>',
  prev:'<svg viewBox="0 0 24 24"><g transform="translate(24 0) scale(-1 1)"><path d="M5 5.7v12.6a.9.9 0 0 0 1.4.75l8.5-6.3a.9.9 0 0 0 0-1.5L6.4 4.95A.9.9 0 0 0 5 5.7z"/><rect x="16.4" y="4.6" width="2.8" height="14.8" rx="1.3"/></g></svg>',
  heart:`<svg viewBox="0 0 24 24"><path ${S} d="M12 20.5s-7.5-4.6-9.2-9.2C1.7 8.1 3.6 5 6.8 5c1.9 0 3.5 1 5.2 3 1.7-2 3.3-3 5.2-3 3.2 0 5.1 3.1 4 6.3-1.7 4.6-9.2 9.2-9.2 9.2z"/></svg>`,
  heartOn:'<svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.2-9.2C1.7 8.1 3.6 5 6.8 5c1.9 0 3.5 1 5.2 3 1.7-2 3.3-3 5.2-3 3.2 0 5.1 3.1 4 6.3-1.7 4.6-9.2 9.2-9.2 9.2z"/></svg>',
  shuffle:`<svg viewBox="0 0 24 24"><path ${S} d="M3 7h3.2c1.6 0 2.7.7 3.6 2l4.4 6c.9 1.3 2 2 3.6 2H21M3 17h3.2c1.6 0 2.7-.7 3.6-2M14.2 9c.9-1.3 2-2 3.6-2H21M18.5 4.5 21 7l-2.5 2.5M18.5 14.5 21 17l-2.5 2.5"/></svg>`,
  repeat:`<svg viewBox="0 0 24 24"><path ${S} d="M4 11v-1a3 3 0 0 1 3-3h12M16 4l3 3-3 3M20 13v1a3 3 0 0 1-3 3H5M8 20l-3-3 3-3"/></svg>`,
  repeat1:`<svg viewBox="0 0 24 24"><path ${S} d="M4 11v-1a3 3 0 0 1 3-3h12M16 4l3 3-3 3M20 13v1a3 3 0 0 1-3 3H5M8 20l-3-3 3-3"/><text x="12" y="14.6" font-size="7.5" font-weight="800" text-anchor="middle" stroke="none">1</text></svg>`,
  down:`<svg viewBox="0 0 24 24"><path ${S} stroke-width="2.2" d="M6 9.5l6 6 6-6"/></svg>`,
  tabDiscover:`<svg viewBox="0 0 24 24"><path ${S} stroke-width="2.1" d="M4 14v-4M8 18V6M12 21V3M16 17V7M20 13v-2"/></svg>`,
  tabFavs:`<svg viewBox="0 0 24 24"><path ${S} d="M12 20.5s-7.5-4.6-9.2-9.2C1.7 8.1 3.6 5 6.8 5c1.9 0 3.5 1 5.2 3 1.7-2 3.3-3 5.2-3 3.2 0 5.1 3.1 4 6.3-1.7 4.6-9.2 9.2-9.2 9.2z"/></svg>`,
  tabQueue:`<svg viewBox="0 0 24 24"><path ${S} stroke-width="2.1" d="M4 6h16M4 12h9M4 18h9"/><path d="M17 13.8v6.4l4.8-3.2z"/></svg>`
};
function tabHTML(icon, label){ return I[icon] + '<span>' + label + '</span>'; }
$('tabDiscover').innerHTML = tabHTML('tabDiscover', 'Discover');
$('tabFavs').innerHTML = tabHTML('tabFavs', 'Favorites');
$('tabQueue').innerHTML = tabHTML('tabQueue', 'Queue');
$('close').innerHTML = I.down;
$('miniNext').innerHTML = I.next;
$('prev').innerHTML = I.prev;
$('next').innerHTML = I.next;
$('shuf').innerHTML = I.shuffle;

/* ---------- state ---------- */
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
const state = {
  tab: 'discover',
  results: [],
  status: 'loading',   // loading | ok | empty | error
  favs: store.get('np_favs', []),
  queue: [],
  idx: -1,
  shuffle: store.get('np_shuffle', false),
  repeat: store.get('np_repeat', 0),   // 0 off, 1 all, 2 one
  chip: 'Afrobeats',
  query: '',
  last: null
};

const CHIPS = [
  {l:'Afrobeats', type:'genre', v:'Afrobeats'},
  {l:'Naija', type:'search', v:'naija'},
  {l:'Amapiano', type:'search', v:'amapiano'},
  {l:'Covers', type:'search', v:'afrobeats cover'},
  {l:'Yoruba', type:'search', v:'yoruba'},
  {l:'Highlife', type:'search', v:'highlife'},
  {l:'Street pop', type:'search', v:'street pop'},
  {l:'Hip-hop', type:'genre', v:'Hip-Hop/Rap'},
  {l:'R&B', type:'genre', v:'R&B/Soul'},
  {l:'Dancehall', type:'genre', v:'Dancehall'},
  {l:'Gospel', type:'search', v:'gospel'}
];

/* ---------- helpers ---------- */
function fmt(s){ s = Math.max(0, Math.floor(s || 0)); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }
function artOf(t){ const a = t.artwork || {}; return a['480x480'] || a['150x150'] || a['1000x1000'] || ''; }
function artSmall(t){ const a = t.artwork || {}; return a['150x150'] || a['480x480'] || ''; }
function cssUrl(u){ return 'url("' + String(u).replace(/"/g, '%22') + '")'; }
function streamUrl(t){ return `${API}/tracks/${t.id}/stream?app_name=${APP}`; }
function isFav(t){ return state.favs.some(f => f.id === t.id); }
function slim(t){ return { id:t.id, title:t.title, duration:t.duration, artwork:t.artwork, user:{ name:(t.user||{}).name } }; }
function cur(){ return state.queue[state.idx]; }
function toggleFav(t){
  if (isFav(t)) state.favs = state.favs.filter(f => f.id !== t.id);
  else state.favs.unshift(slim(t));
  store.set('np_favs', state.favs);
  render(); syncFull();
}

async function api(path){
  const r = await fetch(`${API}${path}${path.includes('?') ? '&' : '?'}app_name=${APP}`);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const j = await r.json();
  return (j.data || []).filter(t => t && t.is_streamable !== false && !t.is_stream_gated && !t.is_unlisted);
}

async function load(chip, query){
  state.last = { chip, query };
  state.query = query || '';
  state.status = 'loading'; state.results = [];
  $('scroll').scrollTop = 0;
  render();
  try {
    let data;
    if (query) data = await api(`/tracks/search?query=${encodeURIComponent(query)}&limit=50`);
    else if (chip.type === 'genre') data = await api(`/tracks/trending?genre=${encodeURIComponent(chip.v)}&time=week&limit=50`);
    else data = await api(`/tracks/search?query=${encodeURIComponent(chip.v)}&limit=50`);
    state.results = data.map(slim);
    state.status = data.length ? 'ok' : 'empty';
  } catch (e) { state.status = 'error'; }
  render();
}

/* ---------- ambient background ---------- */
let bgFlip = false, lastBg = '';
function setBg(url){
  if (!url || url === lastBg) return;
  lastBg = url;
  const im = new Image();
  im.onload = () => {
    if (url !== lastBg) return;
    const next = $(bgFlip ? 'bgA' : 'bgB'), prev = $(bgFlip ? 'bgB' : 'bgA');
    next.style.backgroundImage = cssUrl(url);
    next.classList.add('on'); prev.classList.remove('on');
    bgFlip = !bgFlip;
    $('fbg').style.backgroundImage = cssUrl(url);
  };
  im.src = url;
}

/* ---------- rendering ---------- */
function renderChips(){
  const box = $('chips'); box.innerHTML = '';
  CHIPS.forEach(c => {
    const b = document.createElement('button');
    b.className = 'chip glass' + (state.chip === c.l ? ' on' : '');
    b.textContent = c.l;
    b.onclick = () => { state.chip = c.l; $('q').value = ''; setTab('discover'); renderChips(); load(c); };
    box.appendChild(b);
  });
}

function row(t, list, i){
  const isNow = !!cur() && cur().id === t.id;
  const el = document.createElement('div');
  el.className = 'row' + (isNow ? ' now' : '');
  el.setAttribute('role', 'button'); el.tabIndex = 0;

  const art = document.createElement('div'); art.className = 'art';
  const a = artOf(t); if (a) art.style.backgroundImage = cssUrl(a);
  if (isNow) art.insertAdjacentHTML('beforeend', '<span class="eq"><i></i><i></i><i></i></span>');

  const meta = document.createElement('div'); meta.className = 'meta';
  const ti = document.createElement('div'); ti.className = 't'; ti.textContent = t.title;
  const su = document.createElement('div'); su.className = 's'; su.textContent = (t.user || {}).name || 'Unknown artist';
  meta.append(ti, su);

  const du = document.createElement('div'); du.className = 'dur'; du.textContent = t.duration ? fmt(t.duration) : '';

  const h = document.createElement('button');
  const f = isFav(t);
  h.className = 'heart' + (f ? ' on' : '');
  h.innerHTML = f ? I.heartOn : I.heart;
  h.setAttribute('aria-label', f ? 'Remove from favorites' : 'Add to favorites');
  h.onclick = e => { e.stopPropagation(); toggleFav(t); };

  el.append(art, meta, du, h);
  el.onclick = () => playList(list, i);
  el.onkeydown = e => { if (e.key === 'Enter') playList(list, i); };
  return el;
}

function skeleton(){
  let h = '';
  for (let i = 0; i < 9; i++) h += '<div class="skel"><div class="art"></div><div class="meta"><div class="ln" style="width:' + (62 + (i*13)%28) + '%"></div><div class="ln" style="width:' + (34 + (i*17)%22) + '%;height:10px"></div></div></div>';
  return h;
}

function message(title, body, action){
  const d = document.createElement('div'); d.className = 'msg glass';
  const b = document.createElement('b'); b.textContent = title;
  const p = document.createElement('p'); p.textContent = body;
  d.append(b, p);
  if (action) { const btn = document.createElement('button'); btn.textContent = action.label; btn.onclick = action.fn; d.appendChild(btn); }
  return d;
}

function render(){
  const box = $('list'); box.innerHTML = '';
  const discover = state.tab === 'discover';
  $('hero').hidden = !discover; $('chipsbar').hidden = !discover;
  ['discover','favs','queue'].forEach(k => {
    const b = $({discover:'tabDiscover', favs:'tabFavs', queue:'tabQueue'}[k]);
    b.classList.toggle('on', state.tab === k);
    if (state.tab === k) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });

  let list = [], title = '';
  if (discover) {
    title = state.query ? 'Results for “' + state.query + '”' : state.chip;
    if (state.status === 'loading') { $('lhT').textContent = title; $('playall').hidden = true; box.innerHTML = skeleton(); return; }
    if (state.status === 'error') {
      $('lhT').textContent = title; $('playall').hidden = true;
      box.appendChild(message('Can’t reach Audius', 'Check your connection, then try again.', { label:'Try again', fn:() => state.last && load(state.last.chip, state.last.query) }));
      return;
    }
    if (state.status === 'empty') {
      $('lhT').textContent = title; $('playall').hidden = true;
      box.appendChild(message('No songs found', 'Try a different spelling, an artist name, or pick a category above.'));
      return;
    }
    list = state.results;
  } else if (state.tab === 'favs') {
    title = 'Favorites'; list = state.favs;
    if (!list.length) {
      $('lhT').textContent = title; $('playall').hidden = true;
      box.appendChild(message('No favorites yet', 'Tap the heart on any song to keep it here.'));
      return;
    }
  } else {
    title = 'Up next'; list = state.queue;
    if (!list.length) {
      $('lhT').textContent = title; $('playall').hidden = true;
      box.appendChild(message('Nothing queued', 'Play any song and the list continues here.'));
      return;
    }
  }

  $('lhT').innerHTML = ''; $('lhT').append(document.createTextNode(title));
  const c = document.createElement('small'); c.textContent = list.length + (list.length === 1 ? ' song' : ' songs'); $('lhT').appendChild(c);
  const pa = $('playall');
  pa.hidden = state.tab === 'queue';
  pa.innerHTML = I.play + '<span>Play all</span>';
  pa.onclick = () => playList(list, 0);

  const frag = document.createDocumentFragment();
  list.forEach((t, i) => frag.appendChild(row(t, list, i)));
  box.appendChild(frag);
}

function setTab(t){
  if (state.tab !== t) $('scroll').scrollTop = 0;
  state.tab = t; render();
}

/* ---------- playback ---------- */
function playList(list, i){ state.queue = list.slice(); state.idx = i; startCurrent(); }
function startCurrent(){
  const t = cur(); if (!t) return;
  audio.src = streamUrl(t);
  audio.play().catch(() => {});
  updateUI(); updateMedia();
}
function next(auto){
  if (!state.queue.length) return;
  if (auto && state.repeat === 2) { audio.currentTime = 0; audio.play().catch(()=>{}); return; }
  if (state.shuffle && state.queue.length > 1) {
    let n; do { n = Math.floor(Math.random() * state.queue.length); } while (n === state.idx);
    state.idx = n;
  } else if (state.idx < state.queue.length - 1) state.idx++;
  else if (state.repeat === 1 || !auto) state.idx = 0;
  else { audio.pause(); return; }
  startCurrent();
}
function prev(){
  if (!state.queue.length) return;
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  state.idx = state.idx > 0 ? state.idx - 1 : state.queue.length - 1;
  startCurrent();
}
function toggle(){ if (!cur()) return; audio.paused ? audio.play().catch(()=>{}) : audio.pause(); }

function updateUI(){
  const t = cur(); if (!t) return;
  $('mini').classList.add('show');
  const a = artOf(t);
  $('miniArt').style.backgroundImage = a ? cssUrl(a) : '';
  $('cover').style.backgroundImage = a ? cssUrl(a) : '';
  setBg(artSmall(t));
  const name = (t.user || {}).name || 'Unknown artist';
  $('miniT').textContent = t.title; $('miniS').textContent = name;
  $('fT').textContent = t.title; $('fS').textContent = name;
  syncFull(); render();
}
function syncFull(){
  const t = cur(); if (!t) return;
  const f = isFav(t);
  $('fheart').innerHTML = f ? I.heartOn : I.heart;
  $('fheart').classList.toggle('on', f);
  $('fheart').setAttribute('aria-label', f ? 'Remove from favorites' : 'Add to favorites');
  $('shuf').classList.toggle('on', state.shuffle);
  $('shuf').setAttribute('aria-pressed', state.shuffle);
  $('rep').classList.toggle('on', state.repeat > 0);
  $('rep').innerHTML = state.repeat === 2 ? I.repeat1 : I.repeat;
  $('rep').setAttribute('aria-label', ['Repeat off', 'Repeat all', 'Repeat one'][state.repeat]);
}
function updatePP(){
  const icon = audio.paused ? I.play : I.pause;
  $('miniPP').innerHTML = icon; $('pp').innerHTML = icon;
  document.body.classList.toggle('playing', !audio.paused);
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = audio.paused ? 'paused' : 'playing';
}
function updateMedia(){
  if (!('mediaSession' in navigator)) return;
  const t = cur(); if (!t) return;
  const a = artOf(t);
  navigator.mediaSession.metadata = new MediaMetadata({
    title: t.title, artist: (t.user||{}).name || 'Unknown', album: 'NaijaPlay',
    artwork: a ? [{ src: a, sizes: '480x480', type: 'image/jpeg' }] : []
  });
}
if ('mediaSession' in navigator) {
  const ms = navigator.mediaSession;
  const set = (n, f) => { try { ms.setActionHandler(n, f); } catch(e){} };
  set('play', () => audio.play().catch(()=>{}));
  set('pause', () => audio.pause());
  set('previoustrack', prev);
  set('nexttrack', () => next(false));
  set('seekto', d => { if (d.seekTime != null) audio.currentTime = d.seekTime; });
  set('seekbackward', d => { audio.currentTime = Math.max(0, audio.currentTime - (d.seekOffset || 10)); });
  set('seekforward', d => { audio.currentTime = audio.currentTime + (d.seekOffset || 10); });
}

let seeking = false;
function trackDur(){ return audio.duration || (cur() && cur().duration) || 0; }
audio.addEventListener('play', updatePP);
audio.addEventListener('pause', updatePP);
audio.addEventListener('ended', () => next(true));
audio.addEventListener('error', () => { if (cur()) setTimeout(() => next(true), 800); });
audio.addEventListener('timeupdate', () => {
  const d = trackDur();
  const p = d ? Math.min(1, audio.currentTime / d) : 0;
  $('miniBar').style.width = (p * 100) + '%';
  if (!seeking) { $('seek').value = Math.round(p * 1000); $('seek').style.setProperty('--p', (p * 100) + '%'); $('cur').textContent = fmt(audio.currentTime); }
  $('dur').textContent = fmt(d);
  if ('mediaSession' in navigator && d && isFinite(d)) {
    try { navigator.mediaSession.setPositionState({ duration: d, position: Math.min(audio.currentTime, d), playbackRate: 1 }); } catch(e){}
  }
});
$('seek').addEventListener('input', () => {
  seeking = true;
  const v = $('seek').value / 1000;
  $('seek').style.setProperty('--p', (v * 100) + '%');
  $('cur').textContent = fmt(v * trackDur());
});
$('seek').addEventListener('change', () => {
  audio.currentTime = ($('seek').value / 1000) * trackDur(); seeking = false;
});

/* ---------- full player sheet ---------- */
function openFull(){ $('full').classList.add('open'); }
function closeFull(){ $('full').classList.remove('open'); }
(function(){
  const sheet = $('full'), zone = $('fdrag');
  let sy = 0, dy = 0, lastY = 0, lastT = 0, vy = 0, drag = false;
  zone.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    drag = true; sy = lastY = e.clientY; lastT = e.timeStamp; vy = 0; dy = 0;
    sheet.style.transition = 'none';
    try { zone.setPointerCapture(e.pointerId); } catch(err){}
  });
  zone.addEventListener('pointermove', e => {
    if (!drag) return;
    dy = Math.max(0, e.clientY - sy);
    const dt = e.timeStamp - lastT;
    if (dt > 0) { vy = (e.clientY - lastY) / dt; lastY = e.clientY; lastT = e.timeStamp; }
    sheet.style.transform = 'translateY(' + dy + 'px)';
  });
  const end = () => {
    if (!drag) return; drag = false;
    sheet.style.transition = ''; sheet.style.transform = '';
    if (dy > 140 || vy > 0.6) closeFull();
  };
  zone.addEventListener('pointerup', end);
  zone.addEventListener('pointercancel', end);
})();

/* ---------- wiring ---------- */
$('miniPP').onclick = e => { e.stopPropagation(); toggle(); };
$('miniNext').onclick = e => { e.stopPropagation(); next(false); };
$('pp').onclick = toggle;
$('next').onclick = () => next(false);
$('prev').onclick = prev;
$('shuf').onclick = () => { state.shuffle = !state.shuffle; store.set('np_shuffle', state.shuffle); syncFull(); };
$('rep').onclick = () => { state.repeat = (state.repeat + 1) % 3; store.set('np_repeat', state.repeat); syncFull(); };
$('fheart').onclick = () => { const t = cur(); if (t) toggleFav(t); };
$('miniOpen').onclick = openFull;
$('close').onclick = closeFull;
document.querySelectorAll('.tab').forEach(b => b.onclick = () => setTab(b.dataset.tab));
$('sform').addEventListener('submit', e => {
  e.preventDefault();
  const q = $('q').value.trim(); if (!q) return;
  $('q').blur(); state.chip = ''; renderChips(); setTab('discover'); load(null, q);
});
document.addEventListener('touchstart', () => {}, { passive: true }); // enables :active on iOS
$('scroll').addEventListener('scroll', () => {
  $('chipsbar').classList.toggle('stuck', $('scroll').scrollTop > $('hero').offsetHeight - 2);
}, { passive: true });

updatePP();
renderChips();
load(CHIPS[0]);
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
